<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talos Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="qrc:///style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            overflow: hidden;
            background-color: rgba(18, 18, 24, 0.85) !important;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
        }

        #root-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        #hole-border {
            position: absolute;
            display: none;
            pointer-events: none;
            border: 2px solid #007aff;
            background-color: transparent;
            z-index: 9999;
        }

        .handle {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #007aff;
            border: 1px solid #ffffff;
            border-radius: 2px;
        }
        .handle-tl { top: -4px; left: -4px; }
        .handle-tr { top: -4px; right: -4px; }
        .handle-bl { bottom: -4px; left: -4px; }
        .handle-br { bottom: -4px; right: -4px; }

        #chat-container {
            flex: 1 1 auto;
            width: 100%;
            padding: 12px;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }

        #hole-spacer {
            display: none;
            pointer-events: none;
            margin: 8px;
        }

        #messages {
            display: block;
            width: 100%;
        }

        .message-row {
            clear: both;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            width: 100%;
            position: relative;
        }

        .message-row.user {
            align-items: flex-end;
        }

        .message-row.ai {
            align-items: flex-start;
        }

        .bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            word-break: break-word;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            user-select: text;
            -webkit-user-select: text;
        }

        .user .bubble {
            background-color: #007aff;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .ai .bubble {
            background-color: #2c2c2e;
            color: #f2f2f7;
            border-bottom-left-radius: 2px;
        }

        .bubble p {
            margin-bottom: 8px;
        }
        .bubble p:last-child {
            margin-bottom: 0;
        }

        .bubble code:not(pre code) {
            background-color: rgba(0, 0, 0, 0.35);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: #ff9f0a;
            user-select: text;
            -webkit-user-select: text;
        }

        .bubble pre {
            background-color: #1e1e24;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
            position: relative;
            padding-top: 32px;
            user-select: text;
            -webkit-user-select: text;
        }

        .bubble pre code {
            background-color: transparent;
            padding: 10px 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.45;
            display: block;
            user-select: text;
            -webkit-user-select: text;
        }

        .code-copy-btn {
            position: absolute;
            top: 4px;
            right: 6px;
            background-color: rgba(255, 255, 255, 0.08);
            color: #a1a1a6;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 11px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            -webkit-user-select: none;
            z-index: 10;
        }

        .code-copy-btn:hover {
            background-color: rgba(255, 255, 255, 0.18);
            color: #ffffff;
        }

        .code-copy-btn.copied {
            background-color: #30d158;
            color: #000000;
            border-color: #30d158;
        }

        .msg-copy-btn {
            margin-top: 4px;
            background: transparent;
            border: none;
            color: #8e8e93;
            font-size: 11px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.15s ease, color 0.15s ease;
            padding: 2px 4px;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Inter', sans-serif;
        }

        .msg-copy-btn:hover {
            opacity: 1;
            color: #ffffff;
        }

        .bubble ul, .bubble ol {
            margin-left: 20px;
            margin-bottom: 8px;
        }
        .bubble h1, .bubble h2, .bubble h3 {
            margin-top: 8px;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .bubble h1 { font-size: 1.3em; }
        .bubble h2 { font-size: 1.15em; }
        .bubble h3 { font-size: 1.05em; }

        #input-container {
            flex: 0 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 10px 12px;
            background-color: rgba(28, 28, 36, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            transition: height 0.2s ease;
        }

        #message-input {
            flex: 1;
            background-color: #2c2c2e;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 14px;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
            resize: none;
            min-height: 40px;
            max-height: 250px;
            line-height: 1.4;
            font-family: 'Inter', sans-serif;
        }

        #message-input:focus {
            border-color: #007aff;
        }

        .action-btn {
            background-color: #3a3a3c;
            color: #ffffff;
            border: none;
            border-radius: 18px;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            white-space: nowrap;
            height: 38px;
            font-family: 'Inter', sans-serif;
        }

        .action-btn:active {
            opacity: 0.8;
        }

        #expand-btn {
            background-color: #3a3a3c;
            width: 32px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            border: none;
            color: #fff;
        }

        #send-btn {
            background-color: #007aff;
            color: #ffffff;
            border: none;
            border-radius: 18px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            height: 38px;
            font-family: 'Inter', sans-serif;
        }

        #send-btn:active {
            opacity: 0.8;
        }

        #root-wrapper.expanded-input #chat-container {
            display: none;
        }
        #root-wrapper.expanded-input #input-container {
            height: 100% !important;
            flex: 1;
            flex-direction: column;
            align-items: stretch;
            padding: 16px;
        }
        #root-wrapper.expanded-input #message-input {
            max-height: none;
            flex: 1;
            border-radius: 8px;
        }
        #root-wrapper.expanded-input .bottom-toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .bottom-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #capture-btn.success { background-color: #34c759 !important; }
        #capture-btn.error { background-color: #ff3b30 !important; }
    </style>
</head>
<body>

<div id="root-wrapper">
    <div id="hole-border">
        <div class="handle handle-tl"></div>
        <div class="handle handle-tr"></div>
        <div class="handle handle-bl"></div>
        <div class="handle handle-br"></div>
    </div>

    <div id="chat-container">
        <div id="hole-spacer"></div>
        <div id="messages"></div>
    </div>

    <div id="input-container">
        <button id="expand-btn" title="Expand input">⤢</button>
        <textarea id="message-input" rows="1" placeholder="Type a message or paste code..."></textarea>
        <div class="bottom-toolbar">
            <button id="capture-btn" class="action-btn">Capture</button>
            <button id="mic-btn" class="action-btn">Mic</button>
            <button id="send-btn">Send</button>
        </div>
    </div>
</div>

<script src="qrc:///widgets/chat/app.js"></script>
</body>
</html>
