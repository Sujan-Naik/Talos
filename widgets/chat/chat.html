<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talos Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="qrc:///style.css">
    <link rel="stylesheet" href="qrc:///widgets/chat/chat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            min-width: 0;
            min-height: 0;
        }

        #root-wrapper {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            box-sizing: border-box;
        }

        #hole-border {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        #hole-spacer {
            box-sizing: border-box;
            margin: 0 !important;
            padding: 0;
        }
    </style>
</head>
<body class="bg-gray-900">
<div id="root-wrapper" class="flex flex-col w-full h-full relative overflow-hidden">

    <div id="hole-border"
         class="absolute hidden pointer-events-none border-2 border-blue-500 bg-transparent z-50">
        <div class="handle handle-tl"></div>
        <div class="handle handle-tr"></div>
        <div class="handle handle-bl"></div>
        <div class="handle handle-br"></div>
    </div>

    <div id="chat-container" class="flex-1 w-full p-3 overflow-y-auto overflow-x-hidden relative">
        <div id="hole-spacer" class="hidden pointer-events-none"></div>
        <div id="messages" class="block w-full"></div>
    </div>

    <div id="tts-settings" class="hidden px-3 pb-2 bg-gray-800 border-t border-gray-700">
        <div class="rounded-xl bg-gray-700/70 border border-gray-600 p-3">
            <div class="flex flex-wrap items-center gap-2">
                <label for="tts-voice-select" class="text-xs font-semibold text-gray-300">Voice</label>
                <select id="tts-voice-select" class="flex-1 min-w-[180px] bg-gray-800 text-white border border-gray-600 rounded-lg px-2.5 py-2 text-sm outline-none focus:border-blue-500"></select>
                <button id="tts-voice-apply-btn" class="bg-blue-500 text-white border-none rounded-lg px-3 py-2 text-sm font-semibold cursor-pointer">Apply</button>
            </div>

            <div class="flex flex-wrap items-center gap-2 mt-2">
                <label for="tts-voice-custom" class="text-xs font-semibold text-gray-300">Custom / blend</label>
                <input id="tts-voice-custom" type="text" placeholder="e.g. af_sky,af_bella" class="flex-1 min-w-[180px] bg-gray-800 text-white border border-gray-600 rounded-lg px-2.5 py-2 text-sm outline-none focus:border-blue-500">
                <button id="tts-voice-custom-btn" class="bg-gray-600 text-white border-none rounded-lg px-3 py-2 text-sm font-medium cursor-pointer">Use</button>
            </div>

            <div class="text-[11px] text-gray-400 mt-2">
                The server's installed Kokoro voices are listed automatically. Custom input also accepts a voice blend such as <span class="font-mono">af_sky,af_bella</span>.
            </div>
        </div>
    </div>

    <div id="input-container" class="flex items-end gap-2 p-3 bg-gray-800 border-t border-gray-700 z-10 transition-all duration-200">
        <button id="expand-btn" title="Expand input" class="bg-gray-700 w-8 h-10 rounded-lg flex items-center justify-center text-sm cursor-pointer border-none text-white">⤢</button>
        <textarea id="message-input" rows="1" placeholder="Type a message or paste code..." class="flex-1 bg-gray-700 text-white border border-gray-600 rounded-xl px-3 py-2.5 text-sm outline-none resize-none min-h-10 max-h-60 leading-relaxed focus:border-blue-500"></textarea>

        <div class="bottom-toolbar flex items-center gap-2">
            <button id="tts-btn" class="action-btn bg-gray-600 text-white border-none rounded-full px-3.5 py-2 text-sm font-medium cursor-pointer h-10 transition-colors">TTS: Off</button>
            <button id="tts-settings-btn" title="TTS voice settings" class="action-btn bg-gray-600 text-white border-none rounded-full px-3.5 py-2 text-sm font-medium cursor-pointer h-10 transition-colors">Voice</button>
            <button id="capture-btn" class="action-btn bg-gray-600 text-white border-none rounded-full px-3.5 py-2 text-sm font-medium cursor-pointer h-10 transition-colors">Capture</button>
            <button id="mic-btn" class="action-btn bg-gray-600 text-white border-none rounded-full px-3.5 py-2 text-sm font-medium cursor-pointer h-10 transition-colors">Mic</button>
            <button id="send-btn" class="bg-blue-500 text-white border-none rounded-full px-4 py-2 text-sm font-semibold cursor-pointer h-10">Send</button>
        </div>
    </div>
</div>

<script src="qrc:///widgets/chat/chat.js"></script>
</body>
</html>
