<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        #chat-container {
            position: relative;
            width: 100%;
            height: 100%;
            padding: 12px;
            overflow-y: auto;
        }

        #hole-spacer {
            display: none;
            position: absolute;
            pointer-events: none;
            background-color: rgba(255, 20, 147, 0.55);
            border: 2px dashed #ff1493;
            border-radius: 6px;
            z-index: 9999;
            box-shadow: 0 0 12px rgba(255, 20, 147, 0.8);
            transition: top 0.05s ease-out, left 0.05s ease-out, width 0.05s ease-out, height 0.05s ease-out;
        }

        #messages {
            display: block;
            width: 100%;
        }

        .message-row {
            clear: both;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            transition: padding-left 0.1s ease, padding-right 0.1s ease;
        }

        .message-row.user {
            align-items: flex-end;
        }

        .message-row.ai {
            align-items: flex-start;
        }

        .bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.45;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user .bubble {
            background-color: #007aff;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .ai .bubble {
            background-color: #2c2c2e;
            color: #f2f2f7;
            border-bottom-left-radius: 2px;
        }
    </style>
</head>
<body>
<div id="chat-container">
    <div id="hole-spacer"></div>
    <div id="messages"></div>
</div>

<script>
    let currentHole = { x: 0, y: 0, width: 0, height: 0, viewWidth: 0 };

    function updateHoleRect(x, y, width, height, viewWidth) {
        currentHole = { x, y, width, height, viewWidth };

        const spacer = document.getElementById('hole-spacer');
        const container = document.getElementById('chat-container');

        if (!spacer || !container) return;

        if (width <= 0 || height <= 0) {
            spacer.style.display = 'none';
            recalculateLayout();
            return;
        }

        const scrollTop = container.scrollTop;
        const adjustedY = y + scrollTop;

        spacer.style.display = 'block';
        spacer.style.left = x + 'px';
        spacer.style.top = adjustedY + 'px';
        spacer.style.width = width + 'px';
        spacer.style.height = height + 'px';

        recalculateLayout();
    }

    function recalculateLayout() {
        const container = document.getElementById('chat-container');
        const rows = document.querySelectorAll('.message-row');

        if (!container) return;

        const scrollTop = container.scrollTop;
        const holeTop = currentHole.y + scrollTop;
        const holeBottom = holeTop + currentHole.height;
        const holeLeft = currentHole.x;
        const holeRight = currentHole.x + currentHole.width;
        const viewWidth = currentHole.viewWidth || container.clientWidth;

        rows.forEach(row => {
            if (currentHole.width <= 0 || currentHole.height <= 0) {
                row.style.paddingLeft = '0px';
                row.style.paddingRight = '0px';
                return;
            }

            const rowTop = row.offsetTop;
            const rowBottom = rowTop + row.offsetHeight;

            if (rowBottom >= holeTop && rowTop <= holeBottom) {
                const isHoleOnLeft = (holeLeft + currentHole.width / 2) < (viewWidth / 2);

                if (isHoleOnLeft) {
                    const padLeft = Math.max(0, holeRight + 8);
                    row.style.paddingLeft = padLeft + 'px';
                    row.style.paddingRight = '0px';
                } else {
                    const padRight = Math.max(0, (viewWidth - holeLeft) + 8);
                    row.style.paddingRight = padRight + 'px';
                    row.style.paddingLeft = '0px';
                }
            } else {
                row.style.paddingLeft = '0px';
                row.style.paddingRight = '0px';
            }
        });
    }

    function appendMessage(text, isUser) {
        const messagesDiv = document.getElementById('messages');
        if (!messagesDiv) return;

        const row = document.createElement('div');
        row.className = 'message-row ' + (isUser ? 'user' : 'ai');

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;

        row.appendChild(bubble);
        messagesDiv.appendChild(row);

        recalculateLayout();
        scrollToBottom();
    }

    function appendToLastAiMessage(deltaText) {
        const messagesDiv = document.getElementById('messages');
        if (!messagesDiv) return;

        const aiRows = messagesDiv.getElementsByClassName('message-row ai');
        if (aiRows.length === 0) {
            appendMessage(deltaText, false);
            return;
        }

        const lastAiRow = aiRows[aiRows.length - 1];
        const bubble = lastAiRow.querySelector('.bubble');
        if (bubble) {
            bubble.textContent += deltaText;
        }

        recalculateLayout();
        scrollToBottom();
    }

    function scrollToBottom() {
        const container = document.getElementById('chat-container');
        if (container) {
            container.scrollTop = container.scrollHeight;
        }
    }

    document.getElementById('chat-container').addEventListener('scroll', () => {
        if (currentHole.width > 0 && currentHole.height > 0) {
            const spacer = document.getElementById('hole-spacer');
            const container = document.getElementById('chat-container');
            if (spacer && container) {
                spacer.style.top = (currentHole.y + container.scrollTop) + 'px';
            }
            recalculateLayout();
        }
    });

    window.updateHoleRect = updateHoleRect;
    window.appendMessage = appendMessage;
    window.appendToLastAiMessage = appendToLastAiMessage;
</script>
</body>
</html>
